<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="primefaces"
	xmlns:pe="primefaces.extensions">
<h:body>
	<ui:composition template="/layouts/frame-10-full-width.xhtml">
		<ui:define name="title">EditCase</ui:define>
		<ui:define name="content">
			<h:form id="form">
				<p:messages />
				<ic:com.axonivy.connector.casemailcomponent.MailBrowser id="mailBrowserContainer"
					mailBrowserId="form:mailBrowserContainer" caseId="#{data.caseId}"
					caseRef="#{caseBean.buildCaseReference(data.caseId)}" />
				<br />
				<div class="command-btns">
					<p:link value="Back to Case list"
						href="#{ivy.html.startref('197CF45768C992CF/start.ivp')}" />
					<br />
				</div>
			</h:form>

		</ui:define>
	</ui:composition>
</h:body>

</html>
